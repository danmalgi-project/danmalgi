syntax = "proto3";

package chat_store.v1;

option go_package = "github.com/danmalgi-project/danmalgi-chat-server/pkg/gen/private/chat_store/v1;chat_storev1";
option java_package = "com.danmalgi.backend.internal.chat_store.v1";
option java_outer_classname = "ChatStoreProto";

import "google/protobuf/timestamp.proto";

// ChatStoreService: 백엔드(gRPC client)가 chat-server(gRPC server)에서
// 메시지 데이터를 배치 조회하기 위한 서버 간 private API.
// (dm_store 와 방향 반대: 여기선 chat-server 가 서버 구현자.)
service ChatStoreService {
    // GetLastMessages: 채널 ID 목록 → 각 채널의 마지막 메시지를 배치 조회한다.
    rpc GetLastMessages(GetLastMessagesRequest) returns (GetLastMessagesResponse);
}

message GetLastMessagesRequest {
    repeated int64 channel_ids = 1;
}

message GetLastMessagesResponse {
    // 마지막 메시지가 존재하는 채널만 포함(빈 채널은 응답에서 생략).
    repeated ChannelLastMessage last_messages = 1;
}

message ChannelLastMessage {
    int64                     channel_id = 1;
    int64                     message_id = 2;
    string                    content    = 3;
    int64                     sender_id  = 4; // chat-server erd.cql 의 user_id 에 해당
    google.protobuf.Timestamp created_at = 5;
}
