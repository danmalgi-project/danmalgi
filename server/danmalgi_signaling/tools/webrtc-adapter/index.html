  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <h3> Connect </h3>
    <label for="userId">userId (비우면 JWT_TOKEN fallback 사용)</label> <br />
    <input id="userId" type="number" placeholder="예: 5" />
    <button id="connect">connect</button>
    <br /><br />

    <h3> Local Video </h3>
    <video id="localVideo" width="160" height="120" autoplay muted></video> <br />

    <h3> Remote Video </h3>
    <div id="remoteVideos"></div> <br />

    <h3> Logs </h3>
    <div id="logs"></div>

    <button id="quit">quit</button>

  </body>

  <script>
    function start(userId) {
      navigator.mediaDevices.getUserMedia({
        audio: {
          autoGainControl: false,
          channelCount: 2,
          // echoCancellation: false,
          latency: 0,
          noiseSuppression: false,
          sampleRate: 48000,
          sampleSize: 16,
          volume: 1.0
        },
        video: false
      })
      .then(stream => {
        let pc = new RTCPeerConnection()
        pc.ontrack = function (event) {
          let el = document.createElement(event.track.kind)
          el.srcObject = event.streams[0]
          el.autoplay = true
          el.controls = true
          document.getElementById('remoteVideos').appendChild(el)

          console.log(pc.getTransceivers())

          event.streams[0].onremovetrack = ({track}) => {
            if (el.parentNode) {
              el.parentNode.removeChild(el)
            }
          }
        }

        const btn = document.getElementById('quit')
        btn.addEventListener('click', e => {
          pc.close()
        })

        document.getElementById('localVideo').srcObject = stream
        stream.getTracks().forEach(track => pc.addTrack(track, stream))

        pc.onconnectionstatechange = e => {
          console.log(e)
        }

        let wsUrl = `wss://${location.host}/signaling`
        if (userId) {
          wsUrl += `?userId=${encodeURIComponent(userId)}`
        }
        let ws = new WebSocket(wsUrl)
        pc.onicecandidate = e => {
          if (!e.candidate) {
            return
          }

          ws.send(JSON.stringify({event: 'candidate', data: JSON.stringify(e.candidate)}))
        }

        ws.onclose = function(evt) {
          window.alert("Websocket has closed")
        }

        ws.onmessage = function(evt) {
          let msg = JSON.parse(evt.data)
          if (!msg) {
            console.log('failed to parse msg')
            return
          }

          switch (msg.event) {
            case 'offer':
              let offer = JSON.parse(msg.data)
              if (!offer) {
                console.log('failed to parse answer')
                return
              }
              pc.setRemoteDescription(offer)
              pc.createAnswer().then(answer => {
                answer.sdp = answer.sdp.replace('useinbandfec=1', 'useinbandfec=1; stereo=1; maxaveragebitrate=510000');
                pc.setLocalDescription(answer)
                ws.send(JSON.stringify({event: 'answer', data: JSON.stringify(answer)}))
              })
              return

            case 'candidate':
              let candidate = JSON.parse(msg.data)
              if (!candidate) {
                console.log('failed to parse candidate')
                return
              }

              pc.addIceCandidate(candidate)
              break
          }
        }

        ws.onerror = function(evt) {
          console.log("ERROR: " + evt.data)
        }
      }).catch(window.alert)
    }

    document.getElementById('connect').addEventListener('click', () => {
      const userId = document.getElementById('userId').value.trim()
      start(userId)
    })
  </script>
</html>
